name: Daily AI newspaper
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *' # 09:20 Beijing time (UTC+8)
permissions:
  contents: write
concurrency:
  group: daily-ai-newspaper
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and check newspaper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python scripts/publish_daily.py
      - name: Commit only if a new issue was generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No new issue."
          else
            git commit -m "Publish daily AI newspaper"
            git push
          fi
