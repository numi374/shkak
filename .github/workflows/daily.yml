name: Publish daily page
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *' # 09:20 Asia/Shanghai; scheduled starts may be delayed
permissions:
  contents: write
concurrency:
  group: publish-daily-page
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate site and generator
        run: python -m unittest discover -s tests -v
      - name: Generate complete daily data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python scripts/publish_daily.py
      - name: Commit a new day
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new day; existing data was preserved."
          else
            git commit -m "Publish daily page"
            git push origin HEAD:main
          fi
