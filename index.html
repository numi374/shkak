<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日任务 · AI 科技报</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#24342f;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:32px 20px}header{border-bottom:3px solid #24342f;padding-bottom:24px}h1{font-size:clamp(30px,6vw,52px);margin:10px 0}small,.muted{color:#68776f}section{margin:26px 0;background:#fff;padding:24px;border-radius:16px}h2{margin-top:0}button,input,select{font:inherit;padding:9px 12px;border:1px solid #cbd4cd;border-radius:8px}button{cursor:pointer;background:#245943;color:white}form{display:flex;gap:8px;flex-wrap:wrap}form input{flex:1;min-width:160px}label{display:block;padding:12px 0;border-bottom:1px solid #edf0eb}label input{margin-right:10px}a{color:#245943}.done{text-decoration:line-through;color:#829087}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.columns article{background:#f5f3ed;padding:18px;border-radius:10px}@media(max-width:650px){.columns{grid-template-columns:1fr}section{padding:18px}}footer{font-size:13px;color:#68776f}</style></head>
<body><main><header><small>每天一点进展，内容按日期留存</small><h1>每日任务 · AI 科技报</h1><div id="today"></div></header>
<section><h2>今天的任务</h2><div id="tasks"></div><form id="add"><input id="task" aria-label="新任务" placeholder="添加今天想做的一件事" required maxlength="120"><button>添加任务</button></form><p class="muted">任务保存在当前浏览器中。换设备后不会自动同步。</p></section>
<section><h2>AI 科技报</h2><p class="muted">尚未接入每日自动更新。真实日报发布后，将按日期出现在这里。</p><div class="columns"><article><h3>新工具</h3><p>工具用途、适用场景和原始来源。</p></article><article><h3>学习练习</h3><p>每天一个可以动手完成的小练习。</p></article><article><h3>行业趋势</h3><p>关注变化，以及与你的学习和项目的关系。</p></article></div></section>
<section><h2>往期日报</h2><p class="muted">目前暂无已发布日报。</p></section><footer>日报内容与个人任务分开保存；此版本已提供手机布局和本地任务记录。</footer></main>
<script>
const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());
document.getElementById('today').textContent=day+' · 北京时间';
const key='daily-tasks:'+day;let tasks;
try{tasks=JSON.parse(localStorage.getItem(key))}catch(e){}
if(!Array.isArray(tasks))tasks=[{text:'AI 编程练习 15 分钟',done:false}];
function save(){localStorage.setItem(key,JSON.stringify(tasks))}
function render(){const box=document.getElementById('tasks');box.replaceChildren();tasks.forEach((t,i)=>{const label=document.createElement('label'),check=document.createElement('input'),span=document.createElement('span');check.type='checkbox';check.checked=t.done;span.textContent=t.text;if(t.done)span.className='done';check.addEventListener('change',()=>{tasks[i].done=check.checked;save();render()});label.append(check,span);box.append(label)})}
document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('task'),text=input.value.trim();if(!text)return;tasks.push({text,done:false});save();render();input.value=''});render();
</script></body></html>
